name: Release to PyPI

# Tag creation/push is a separate explicit maintainer action.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and build dependencies
        run: python -m pip install -e ".[test,dev]"
      - name: Test
        run: python -m pytest tests -q
      - name: Build and validate release artifacts
        run: |
          python -m build
          python -m twine check dist/*
          python tools/check_distribution.py dist --tag "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
